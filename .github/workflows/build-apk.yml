name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract project
        run: |
          unzip -q Semi_1-android-build-ready.zip -d source
          WRAPPER=$(find source -name gradlew -type f | head -1)
          chmod +x "$WRAPPER"
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> $GITHUB_ENV

      - name: Add Anko repository
        run: |
          sed -i "/repositories {/a\\        maven { url 'https://artifactory.appodeal.com/appodeal-public/' }" "$PROJECT_DIR/build.gradle"

      - name: Build APK
        run: cd "$PROJECT_DIR" && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: semi-1-debug-apk
          path: source/**/app/build/outputs/apk/debug/*.apk
